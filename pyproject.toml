[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvllm-serve"
version = "0.1.0"
description = "Ollama-style resident inference service backed by vLLM (HF-cache model discovery, fixed port, model management, optional auto-routing)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
nvllm-serve = "nvllm_service.cli:main"

[tool.setuptools.packages.find]
include = ["nvllm_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
