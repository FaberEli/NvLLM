name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite is GPU-free: a fake HF hub cache + a stub OpenAI-compatible
    # worker (see tests/conftest.py), so it runs on a plain ubuntu runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable) + test deps
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
